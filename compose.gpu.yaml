# Runs Ollama (embeddings and the local answer model) on the NVIDIA GPU. Needs the NVIDIA driver;
# Docker Desktop on Windows passes the GPU through WSL 2. Use it on top of compose.yaml:
#
#   docker compose -f compose.yaml -f compose.gpu.yaml up -d --build
#
# or set COMPOSE_FILE in .env (see .env.example) so plain `docker compose` commands include it.

services:
  ollama:
    gpus: all
