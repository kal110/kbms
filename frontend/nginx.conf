# Serves the built SPA and proxies the API, so the browser sees one origin and needs no CORS.

# Behind another proxy (Traefik on Dokploy) the browser's scheme arrives as X-Forwarded-Proto; pass it on
# rather than this hop's http, or the API would take HTTPS requests for HTTP and redirect them in a loop.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Local storage uploads (Storage:Provider=Local) come through here; S3 uploads go straight to S3.
        client_max_body_size 100m;
        proxy_request_buffering off;
    }

    # The assistant's answer streams (text/event-stream). A local model may first load and read the
    # passages for a while (Ai:Chat:Local:TimeoutSeconds, 300), so allow more than nginx's 60-second
    # read timeout, and pass each event on as it comes.
    location = /api/knowledge/chat {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_read_timeout 360s;
    }

    # API reference and OpenAPI document (the API maps them in Development).
    location ~ ^/(scalar|openapi/|health$) {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Hashed build output never changes.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes fall back to index.html, which is always revalidated.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
